name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./alva-portfolio # Tells GitHub to step into your subfolder first
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
      - name: install Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./alva-portfolio/package-lock.json # Tells the cacher where to find the lockfile
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build project
        run: npm run build
      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./alva-portfolio/dist # Updates the upload path to target the folder's dist directory


  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      contents: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # dynamic output variable

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
