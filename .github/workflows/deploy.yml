name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers the pipeline every time you push to the main branch
  workflow_dispatch:   # Allows you to manually trigger the workflow from the GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Uses a stable Node production environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Ensures a clean, reliable install matching your package-lock.json

      - name: Build Application
        run: npm run build # Compiles your React app into Vite's default /dist folder

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Tells GitHub to capture Vite's default output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
