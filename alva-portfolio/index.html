<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Alva Si</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&amp;display=swap" />
    <script>
      (() => {
        const night = (() => {
          try { return localStorage.getItem("alva-theme") === "night" } catch { return false }
        })()
        const canvas = night ? "#070910" : "#f7f6f3"
        const root = document.documentElement
        if (night) root.setAttribute("data-dark", "true")
        else root.removeAttribute("data-dark")
        root.style.backgroundColor = canvas
        root.style.colorScheme = night ? "dark" : "light"
        const theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute("content", canvas)
        const colorScheme = document.querySelector('meta[name="color-scheme"]')
        if (colorScheme) colorScheme.setAttribute("content", night ? "dark" : "light")
      })()
    </script>
  </head>
  <body>
    <script>
      document.body.style.backgroundColor = document.documentElement.style.backgroundColor
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
