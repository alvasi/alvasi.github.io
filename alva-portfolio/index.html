<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>alva-portfolio</title>
    <script>
      (() => {
        const night = (() => {
          try { return localStorage.getItem("alva-theme") === "night" } catch { return false }
        })()
        const canvas = night ? "#070910" : "#f7f6f3"
        const root = document.documentElement
        if (night) root.setAttribute("data-dark", "true")
        root.style.backgroundColor = canvas
        root.style.colorScheme = night ? "dark" : "light"
        const theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute("content", canvas)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
